<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepCatch</title>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#13202e;--muted:#5d6b7a;--accent:#0b6fa4;--warn:#b45309;--line:#dde4ec}
@media (prefers-color-scheme:dark){:root{--bg:#0e1620;--card:#16222f;--text:#e8eef5;--muted:#9fb0c1;--accent:#4db3e6;--warn:#fbbf24;--line:#26364a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{margin:0}h1 span{color:var(--accent)}.tag{color:var(--muted);margin:4px 0 20px}
.row{display:flex;gap:8px}input[type=text]{flex:1;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font-size:16px}
button{padding:12px 20px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-size:16px;cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.win{border:2px solid var(--accent)}.badge{background:var(--accent);color:#fff;border-radius:6px;padding:2px 8px;font-size:12px}
.sl{display:grid;grid-template-columns:70px 1fr 40px;gap:8px;align-items:center;font-size:14px}
.meta{color:var(--muted);font-size:14px}.flag{color:var(--warn);font-size:14px}.price{font-size:22px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:3px;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
a{color:var(--accent)}
</style></head><body><main>
<h1>Deep<span>Catch</span></h1><p class="tag">Dive deep. Catch the best buy.</p>
<div class="row"><input id="q" type="text" value="best earbuds under 2000"><button id="go">Dive in</button></div>
<div id="status" class="meta" style="margin-top:10px"></div>
<div id="weights" class="card" hidden>
  <b>What matters to you?</b>
  <div class="sl">Price<input type="range" id="w_price" min="0" max="100" value="40"><span></span></div>
  <div class="sl">Rating<input type="range" id="w_rating" min="0" max="100" value="35"><span></span></div>
  <div class="sl">Trust<input type="range" id="w_trust" min="0" max="100" value="25"><span></span></div>
</div>
<div id="out"></div>
<script>
let DATA=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function score(p){
  const w={price:+$("w_price").value,rating:+$("w_rating").value,trust:+$("w_trust").value};
  const t=(w.price+w.rating+w.trust)||1;
  return (w.price*p.f_price+w.rating*p.f_rating+w.trust*p.f_trust)/t;
}
function render(){
  document.querySelectorAll(".sl span").forEach(s=>s.textContent=s.previousElementSibling.value);
  const ranked=[...DATA].map(p=>({...p,s:score(p)})).sort((a,b)=>b.s-a.s).slice(0,5);
  $("out").innerHTML=ranked.map((p,i)=>`
  <div class="card ${i==0?"win":""}">
    ${i==0?'<span class="badge">Best catch</span> ':''}<b>${esc(p.name)}</b>
    <div class="price">₹${Number(p.price).toLocaleString("en-IN")} <span class="meta">on ${esc(p.store)}${p.discount_pct?` · ${p.discount_pct}% off`:""}</span></div>
    <div class="meta">★ ${esc(p.rating??"n/a")} (${esc(p.review_count??"?")} reviews) · ${esc(p.seller||"seller n/a")} · ${esc(p.delivery||"delivery n/a")}</div>
    <div class="bar"><i style="width:${Math.round(p.s*100)}%"></i></div>
    <div class="meta">Score ${(p.s*100).toFixed(0)}/100 · price ${(p.f_price*100).toFixed(0)} · rating ${(p.f_rating*100).toFixed(0)} · trust ${(p.f_trust*100).toFixed(0)}</div>
    ${p.flags.map(f=>`<div class="flag">⚠ ${esc(f)}</div>`).join("")}
    ${p.url?`<div><a href="${esc(p.url)}" target="_blank" rel="noopener">View listing (source)</a></div>`:""}
  </div>`).join("");
}
$("go").onclick=async()=>{
  $("go").disabled=true;$("out").innerHTML="";$("weights").hidden=true;
  $("status").textContent="TinyFish agents are browsing live stores... this takes about a minute.";
  try{
    const r=await fetch("/api/search",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:$("q").value})});
    const d=await r.json();DATA=d.products;
    $("status").textContent=DATA.length?`Found ${DATA.length} products across stores (budget ₹${d.budget}, source: ${d.source}).`:"No results. Try again or check store URLs.";
    if(DATA.length){$("weights").hidden=false;render();}
  }catch(e){$("status").textContent="Error: "+e}
  $("go").disabled=false;
};
["w_price","w_rating","w_trust"].forEach(id=>$(id).oninput=render);
</script></main></body></html>
